[project]
name = "unbound-dashboard"
version = "2.0.0"
description = "Unbound DNS Dashboard — API FastAPI + DuckDB + Vue 3"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "duckdb>=1.2",
    "redis[hiredis]>=5.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "psutil>=6.0",
    "slowapi>=0.1",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers[redis]>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101"]  # assert em testes

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
