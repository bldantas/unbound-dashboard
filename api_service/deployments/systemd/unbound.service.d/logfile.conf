# Drop-in pro systemd unit do Unbound DNS daemon.
#
# Problema corrigido: Debian/Ubuntu modernos rodam o Unbound com `unbound -d`
# (foreground/debug). Nesse modo, todas as mensagens do daemon — incluindo as
# linhas de query log quando `log-queries: yes` / `log-replies: yes` estão
# ativas — vão pra STDERR, que o systemd captura e manda pro journal. O
# parâmetro `logfile:` no unbound.conf é IGNORADO porque o daemon não está
# escrevendo lá; está escrevendo no stderr.
#
# Consequência: o LogWatcher do unbound-dashboard (que faz tail no arquivo
# configurado em `logfile:`) recebe arquivo vazio e o Live Stream e o
# `query_logs` no DuckDB ficam zerados.
#
# Fix: redireciona stderr pro arquivo esperado em `logfile:`. Drop-in só
# sobrescreve o campo `StandardError=` — sobrevive `apt upgrade` do pacote
# unbound (vs editar o unit principal).
#
# Path do arquivo precisa bater com `logfile:` em /etc/unbound/includes/general.conf
# e com `UNBOUND_LOG` no /etc/unbound-dashboard/api-v1.env (default em ambos:
# /var/log/unbound/unbound.log).

[Service]
StandardError=append:/var/log/unbound/unbound.log
