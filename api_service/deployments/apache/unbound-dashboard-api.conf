# Apache reverse proxy para o FastAPI (api_service/) em 127.0.0.1:8001.
#
# Mapeia:
#   GET/POST /api/v1/*   →  http://127.0.0.1:8001/api/v1/*
#   WebSocket /api/v1/ws/*  →  ws://127.0.0.1:8001/api/v1/ws/*
#
# NÃO afeta:
#   /api/*.php  (continuam servidos pelo PHP-FPM/Apache durante a transição)
#   /api/v2/*   (rotas reservadas pro stack v2 em /opt, atualmente pausada)
#
# Pré-requisitos antes de habilitar:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers
#   sudo a2enconf unbound-dashboard-api
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

<IfModule mod_proxy.c>
    # Defesa em profundidade: nunca atuar como proxy aberto pra terceiros
    ProxyRequests Off
    ProxyPreserveHost On

    # Endpoint HTTP — /api/v1/*
    <Location /api/v1/>
        ProxyPass        http://127.0.0.1:8001/api/v1/ retry=0 timeout=30
        ProxyPassReverse http://127.0.0.1:8001/api/v1/

        # Headers de origem pro backend
        <IfModule mod_headers.c>
            RequestHeader set X-Forwarded-Proto "https" env=HTTPS
            RequestHeader set X-Forwarded-Proto "http"  env=!HTTPS
        </IfModule>
    </Location>

    # Endpoint WebSocket — /api/v1/ws/*
    # (Mantido separado porque ws:// usa mod_proxy_wstunnel, não mod_proxy_http)
    <IfModule mod_proxy_wstunnel.c>
        <Location /api/v1/ws/>
            ProxyPass        ws://127.0.0.1:8001/api/v1/ws/
            ProxyPassReverse ws://127.0.0.1:8001/api/v1/ws/
        </Location>
    </IfModule>
</IfModule>

# ---------------------------------------------------------------------------
# Superfície web do painel (/var/www/html/unbound-dashboard)
#
# DirectoryMatch é aplicado depois dos <Directory> do vhost, então vale mesmo
# que o site do servidor tenha "Options Indexes" ou "Require all granted".
#
# - Sem listagem de diretórios.
# - Pastas internas negadas: dados de runtime (data/, src/data/: progresso,
#   temporários de config/cert, password-recovery.log), código do api_service,
#   scripts e ferramentas de instalação. O navegador só precisa das páginas
#   .php da raiz, de api/*.php e de src/dashboard.css.
# - Cópias antigas do painel deixadas por instaladores anteriores em
#   /var/www/html/unbound-dashboard.backup.* também ficam negadas.
# ---------------------------------------------------------------------------

<DirectoryMatch "^/var/www/html/unbound-dashboard/(data|src/data|src/scripts|api/scripts|api_service|clients|docs|includes|lang|scripts|system|tools|dist|\.git|\.github)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory "/var/www/html/unbound-dashboard/src">
    <FilesMatch "\.(php|json)$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/unbound-dashboard\.backup\.">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/var/www/html/unbound-dashboard(/|$)">
    Options -Indexes
    <FilesMatch "(^\.|\.(md|sh|py|sql|lock|toml|example|log)$|^VERSION$)">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
