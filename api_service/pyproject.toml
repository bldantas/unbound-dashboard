[project]
name = "unbound-dashboard-api"
version = "0.1.0"
description = "FastAPI service da modernização v1 do Unbound Dashboard (DuckDB + Redis + workers asyncio). Apache proxia /api/v1/* para esta API em 127.0.0.1:8001."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
    "redis[hiredis]>=5.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "psutil>=6.1",
    # pandas é dep de produção: workers do api_service usam db_append() com
    # DataFrame para bulk insert no DuckDB (preserva DEFAULT em colunas ausentes,
    # ex: id auto-incremented em query_logs). NÃO mover pra dev — `uv sync --no-dev`
    # quebra o startup (connection.py importa pandas no module-level).
    "pandas>=2.0",
    "pyotp>=2.9",
    # httpx é dep de produção: services/webhook_notifier.py usa pra POST nos
    # webhooks Slack/Discord/Teams. NÃO mover pra dev — `uv sync --no-dev`
    # quebra o startup do api_service.
    "httpx>=0.27",
    # boto3 é dep de produção: services/backup_offsite_service.py faz upload
    # dos backups DuckDB+config pra S3-compatible (AWS S3, MinIO, Wasabi,
    # Cloudflare R2, Backblaze B2). Usado pelo BackupUploader worker.
    "boto3>=1.35",
    "reportlab>=4.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pymysql>=1.1.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",      # assert OK em tests
    "B008",      # Depends()/Query() como default é o idioma do FastAPI
    "ASYNC240",  # pathlib em arquivos locais pequenos (VERSION, logs) dentro de async — custo irrelevante
    "S110",      # try/except/pass em caminhos best-effort (métricas, Redis opcional, cleanup)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]  # tests: hardcoded creds OK; log lines longas em parametrize
"tools/**" = ["S608"]  # tools de migração constroem SQL com nomes de tabela próprios
"app/repositories/duckdb/connection.py" = ["S608"]  # bulk insert constrói INSERT com nome de tabela
"app/workers/log_watcher.py" = ["S104"]  # "0.0.0.0" é string de classificação, não bind address
# S608 auditado em 2026-10-07: SQL montado só com fragmentos fixos do código
# (WHERE com "?", nomes de coluna de allowlists/tuplas literais); valores sempre
# parametrizados. Novos arquivos com SQL dinâmico devem ser revisados antes de
# entrar nesta lista.
"app/repositories/duckdb/alert_repo.py" = ["S608"]
"app/repositories/duckdb/analytics_repo.py" = ["S608"]
"app/repositories/duckdb/blocklist_sources_repo.py" = ["S608"]
"app/repositories/duckdb/client_policies_repo.py" = ["S608"]
"app/repositories/duckdb/threats_repo.py" = ["S608"]
"app/routers/analytics.py" = ["S608"]
"app/routers/grafana.py" = ["S608"]
"app/services/admin_audit_service.py" = ["S608"]
"app/services/api_tokens.py" = ["S608"]
"app/services/approval_service.py" = ["S608"]
"app/services/backup_destinations_service.py" = ["S608"]
"app/services/external_health_service.py" = ["S608"]
"app/services/geo_blocking_service.py" = ["S608"]
"app/services/ha_service.py" = ["S608"]
"app/services/managed_hosts.py" = ["S608"]
"app/services/oidc_service.py" = ["S608"]
"app/services/organizations_service.py" = ["S608"]
"app/workers/anomaly_detector.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
